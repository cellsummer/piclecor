<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDBA74"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- macOS icon grid: 824pt body centred in 1024 -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#gloss)"/>

  <!-- back card -->
  <g transform="rotate(-11 512 520)">
    <rect x="262" y="262" width="460" height="400" rx="44" fill="#FFFFFF" fill-opacity="0.35"/>
  </g>

  <!-- front card shadow -->
  <g transform="rotate(6 540 560)">
    <rect x="318" y="356" width="460" height="400" rx="44" fill="#1E1B4B" fill-opacity="0.28"/>
  </g>

  <!-- front card -->
  <g transform="rotate(6 540 540)">
    <rect x="310" y="330" width="460" height="400" rx="44" fill="#FFFFFF"/>
    <clipPath id="photo">
      <rect x="338" y="358" width="404" height="344" rx="24"/>
    </clipPath>
    <g clip-path="url(#photo)">
      <rect x="338" y="358" width="404" height="344" fill="url(#sky)"/>
      <circle cx="642" cy="452" r="44" fill="#FFF7ED"/>
      <path d="M338 702 L338 610 L450 500 L540 590 L600 540 L742 660 L742 702 Z" fill="url(#hill)"/>
      <path d="M338 702 L338 660 L420 610 L520 676 L600 640 L742 702 Z" fill="#1E1B4B" fill-opacity="0.55"/>
    </g>
  </g>

  <!-- selected badge -->
  <circle cx="742" cy="742" r="118" fill="#1E1B4B" fill-opacity="0.25"/>
  <circle cx="736" cy="732" r="112" fill="#FFFFFF"/>
  <circle cx="736" cy="732" r="96" fill="url(#badge)"/>
  <path d="M688 734 L722 768 L788 700" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Braun / Dieter Rams style: warm grey face, dark dial, orange indicator -->
  <defs>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1EFEA"/>
      <stop offset="1" stop-color="#DCD9D2"/>
    </linearGradient>
  </defs>

  <!-- macOS icon grid: 824pt body centred in 1024 -->
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#face)"/>

    <circle cx="512" cy="470" r="250" fill="#2B2B2B"/>
    <circle cx="512" cy="470" r="214" fill="#3A3A3A"/>
    <circle cx="512" cy="320" r="34" fill="#F26B1D"/>

    <g fill="#A8A49C">
      <circle cx="332" cy="808" r="13"/>
      <circle cx="392" cy="808" r="13"/>
      <circle cx="452" cy="808" r="13"/>
      <circle cx="512" cy="808" r="13"/>
      <circle cx="572" cy="808" r="13"/>
      <circle cx="632" cy="808" r="13"/>
      <circle cx="692" cy="808" r="13"/>
    </g>
  </g>
</svg>
